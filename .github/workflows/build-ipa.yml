name: Build iOS IPA (xtool & Xcode)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build-ios-ipa:
    name: Build & Package NihongoMaster.ipa
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: 🛠️ Install xtool CLI
        run: |
          echo "Tải xtool 1.22.2 từ GitHub Releases..."
          curl -fL "https://github.com/xtool-org/xtool/releases/download/1.22.2/xtool.app.zip" -o /tmp/xtool.zip
          unzip -q /tmp/xtool.zip -d /tmp/
          sudo cp /tmp/xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
          sudo chmod +x /usr/local/bin/xtool
          xtool --help || true

      - name: ⚙️ Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: 🚀 Build iOS App & Package IPA
        working-directory: ios
        run: |
          set -e
          echo "=== 1. Phiên bản Xcode hiện tại ==="
          xcodebuild -version
          
          echo "=== 2. Khởi tạo Xcode project bằng XcodeGen ==="
          xcodegen generate --spec project.yml
          
          echo "=== 3. Biên dịch ứng dụng iOS với xcodebuild ==="
          xcodebuild -project NihongoMaster.xcodeproj \
            -scheme NihongoMaster \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build
          
          echo "=== 4. Tìm kiếm file .app sau khi biên dịch ==="
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "✓ Đã tìm thấy ứng dụng tại: $APP_DIR"
            rm -rf Payload NihongoMaster.ipa
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r -q NihongoMaster.ipa Payload
            rm -rf Payload
            
            echo "🎉 ĐÓNG GÓI THÀNH CÔNG NIHONGOMASTER.IPA:"
            ls -lh NihongoMaster.ipa
          else
            echo "❌ Không tìm thấy thư mục .app!"
            exit 1
          fi

      - name: 📤 Upload IPA Artifact (Thành công)
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMaster-iOS-IPA
          path: ios/NihongoMaster.ipa
          retention-days: 14
