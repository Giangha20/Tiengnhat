name: Build iOS IPA (xtool & Xcode)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build-ios-ipa:
    name: Build & Package NihongoMaster.ipa
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install xtool CLI
        run: |
          echo "Tải xtool phiên bản mới nhất từ GitHub Releases..."
          curl -fL "https://github.com/xtool-org/xtool/releases/download/1.22.2/xtool.app.zip" -o /tmp/xtool.zip
          unzip -q /tmp/xtool.zip -d /tmp/
          sudo cp /tmp/xtool.app/Contents/MacOS/xtool /usr/local/bin/xtool
          sudo chmod +x /usr/local/bin/xtool
          which xtool
          xtool --help || true

      - name: ⚙️ Install XcodeGen
        run: |
          brew install xcodegen || true

      - name: 🚀 Build iOS App & Package IPA
        working-directory: ios
        run: |
          echo "=== 1. Thư mục hiện tại và danh sách file ==="
          pwd
          ls -la
          
          echo "=== 2. Khởi tạo cấu hình ứng dụng iOS ==="
          xcodegen generate --spec project.yml
          
          echo "=== 3. Biên dịch ứng dụng iOS sang ARM64 ==="
          xcodebuild -project NihongoMaster.xcodeproj \
            -scheme NihongoMaster \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            clean build
            
          echo "=== 4. Kiểm tra file .app sau khi biên dịch ==="
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "❌ Không tìm thấy thư mục .app!"
            find build -maxdepth 4
            exit 1
          fi
          
          echo "✓ Ứng dụng đã tạo tại: $APP_DIR"
          
          echo "=== 5. Đóng gói file .ipa chuẩn Payload Apple ==="
          rm -rf Payload NihongoMaster.ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r -q NihongoMaster.ipa Payload
          rm -rf Payload
          
          echo "🎉 ĐÓNG GÓI THÀNH CÔNG NIHONGOMASTER.IPA:"
          ls -lh NihongoMaster.ipa

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMaster-iOS-IPA
          path: ios/NihongoMaster.ipa
          retention-days: 14
