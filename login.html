<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Học Tiếng Trung</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    #ff7675 0,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #74b9ff 0,
                    transparent 35%
                ),
                #f5f7fb;
        }

        /* ===== LOGIN BOX ===== */

        .login-box {
            width: 100%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.96);

            padding: 35px 30px;

            border-radius: 25px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15);

            animation: showBox 0.6s ease;
        }

        @keyframes showBox {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOGO ===== */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid white;

            box-shadow:
                0 8px 25px rgba(214, 48, 49, 0.25);
        }

        .logo-default {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 40px;
            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #d63031,
                    #ff7675
                );
        }

        .title {
            margin-top: 15px;

            font-size: 25px;
            font-weight: 800;

            color: #2d3436;
        }

        .subtitle {
            margin-top: 6px;

            color: #636e72;

            font-size: 14px;
        }

        /* ===== FORM ===== */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #2d3436;
        }

        .input {
            width: 100%;
            height: 52px;

            border: 2px solid #e5e7eb;

            border-radius: 14px;

            padding: 0 15px;

            font-size: 15px;

            outline: none;

            transition: 0.25s;

            background: white;
        }

        .input:focus {
            border-color: #d63031;

            box-shadow:
                0 0 0 4px rgba(214, 48, 49, 0.08);
        }

        /* ===== PASSWORD ===== */

        .password-box {
            position: relative;
        }

        .password-box .input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);

            width: 38px;
            height: 38px;
            padding: 0;

            border: none;
            outline: none;
            background: transparent;

            cursor: pointer;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            line-height: 1;
            color: #636e72;
            opacity: 1;
        }

        .show-password:hover {
            transform: translateY(-50%) scale(1.08);
        }

        .show-password:focus-visible {
            border-radius: 8px;
            box-shadow: 0 0 0 3px rgba(214, 48, 49, 0.15);
        }

        /* ===== REMEMBER ===== */

        .remember {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 20px;

            font-size: 13px;

            color: #636e72;
        }

        .remember input {
            width: 16px;
            height: 16px;

            accent-color: #d63031;

            cursor: pointer;
        }

        /* ===== LOGIN BUTTON ===== */

        .login-btn {
            width: 100%;
            height: 52px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #d63031,
                    #ff7675
                );

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(214, 48, 49, 0.25);

            transition: 0.25s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(214, 48, 49, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ===== MESSAGE ===== */

        .message {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 12px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            color: #c0392b;

            background: #fff0f0;

            border: 1px solid #ffd6d6;
        }

        .message.success {
            display: block;

            color: #008f6f;

            background: #edfff8;

            border: 1px solid #c9f5e6;
        }

        /* ===== REGISTER ===== */

        .register-text {
            text-align: center;

            margin-top: 22px;

            color: #636e72;

            font-size: 14px;
        }

        .register-text a {
            color: #d63031;

            font-weight: 700;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */

        .footer {
            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #95a5a6;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .login-box {
                padding: 28px 20px;

                border-radius: 22px;
            }

            .title {
                font-size: 22px;
            }

            .logo img,
            .logo-default {
                width: 78px;
                height: 78px;
            }

            .input {
                height: 49px;
            }

            .login-btn {
                height: 50px;
            }
        }

        /* ===== DARK MODE ===== */

        @media (prefers-color-scheme: dark) {

            body {
                background: #151719;
            }

            .login-box {
                background: #1e2023;
            }

            .title {
                color: #f5f6fa;
            }

            .subtitle {
                color: #b2bec3;
            }

            label {
                color: #f5f6fa;
            }

            .input {
                background: #25282c;

                border-color: #3d4147;

                color: white;
            }

            .input::placeholder {
                color: #747d85;
            }

            .remember {
                color: #b2bec3;
            }

            .show-password {
                color: #f5f6fa;
            }

            .footer {
                color: #747d85;
            }
        }
    </style>

<svg id="inline-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<defs>
<symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2C11.05 6.07 11.52 6 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.6M6.2 6.9C3.8 8.6 2.5 12 2.5 12S6 18 12 18c1.2 0 2.3-.2 3.3-.6"/></symbol>
<symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
<symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 2 2m-5-1 2 2"/></symbol>
<symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3L12 4Z"/><path d="M12 9v5m0 3h.01"/></symbol>
<symbol id="icon-loading" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
<symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M16 9.5a4 4 0 0 1 0 5m2.5-7.5a8 8 0 0 1 0 10"/></symbol>
<symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 6.5L20 12l-6.5 1.5L12 20l-1.5-6.5L4 12l6.5-2.5L12 3Z"/></symbol>
<symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 15c-1.2-.9-2-2.4-2-4a6 6 0 0 1 12 0c0 1.6-.8 3.1-2 4-.7.5-1 1.2-1 2h-6c0-.8-.3-1.5-1-2Z"/></symbol>
<symbol id="icon-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1 .9-1.7 1.3-1.7 2.8m0 3h.01"/></symbol>
<symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l4-1.5A9 9 0 1 0 5 18.5Z"/><path d="M8 10h8M8 14h5"/></symbol>
<symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
<symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11.5 3.5 3.5 0 0 0 7 18Z"/></symbol>
<symbol id="icon-package" viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></symbol>
<symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="icon-hand" viewBox="0 0 24 24"><path d="M8 13V7a1.5 1.5 0 0 1 3 0v5m0-4a1.5 1.5 0 0 1 3 0v4m0-3a1.5 1.5 0 0 1 3 0v5m0-2a1.5 1.5 0 0 1 3 0v3c0 4-2.5 6-6.5 6H10c-2 0-3-1-4-2l-2-3a1.5 1.5 0 0 1 2.5-1.7L8 16"/></symbol>
</defs></svg>

<style>.ui-icon{width:20px;height:20px;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.ui-icon-lg{width:24px;height:24px}.ui-icon-xl{width:32px;height:32px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}</style>
</head>

<body>

    <div class="login-box">

        <!-- LOGO -->
        <div class="logo">

            <img
                src="avatar192.jpg"
                alt="Tiếng Trung"
                id="logoImage"
                onerror="this.style.display='none'; document.getElementById('logoDefault').style.display='flex';"
            >

            <div
                class="logo-default"
                id="logoDefault"
                style="display:none;"
            >
                中
            </div>

            <h1 class="title">
                Tiếng Trung
            </h1>

            <p class="subtitle">
                Hệ thống học và ôn tập HSK
            </p>

        </div>


        <!-- FORM ĐĂNG NHẬP -->

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Email đăng nhập
                </label>

                <input
                    type="text"
                    id="username"
                    class="input"
                    placeholder="Nhập email đã đăng ký"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Mật khẩu
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        class="input"
                        placeholder="Nhập mật khẩu"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Hiện mật khẩu"
                        title="Hiện mật khẩu"
                    >
                        <svg class="ui-icon" aria-hidden="true"><use href="#icon-eye-off"></use></svg>
                    </button>

                </div>

            </div>


            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                    checked
                >

                <span>
                    Ghi nhớ đăng nhập
                </span>

            </label>


            <button
                type="submit"
                class="login-btn"
            >
                Đăng nhập
            </button>

        </form>
            <div style="text-align:center;margin-top:14px;">
                <a href="forgot-password.html" style="color:#d63031;font-weight:700;text-decoration:none;">
                    <svg class="ui-icon" aria-hidden="true"><use href="#icon-lock"></use></svg> Quên mật khẩu? Đổi bằng OTP
                </a>
            </div>


        <!-- THÔNG BÁO -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- ĐĂNG KÝ -->

        <div class="register-text">

            Chưa có tài khoản?

            <a href="register.html">
                Đăng ký ngay
            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            © 2026 Tiếng Trung - Giang Hà
        </div>

    </div>


<script>
(function () {
    const firebaseScripts = [
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js",
        "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"
    ];

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error("Không tải được Firebase SDK: " + src));
            document.head.appendChild(s);
        });
    }

    async function boot() {
        const showPasswordButton = document.getElementById("showPassword");
        const passwordInput = document.getElementById("password");
        if (showPasswordButton && passwordInput) {
            showPasswordButton.addEventListener("click", function () {
                const hidden = passwordInput.type === "password";
                passwordInput.type = hidden ? "text" : "password";
                showPasswordButton.innerHTML = hidden ? '<svg class="ui-icon" aria-hidden="true"><use href="#icon-eye"></use></svg>' : '<svg class="ui-icon" aria-hidden="true"><use href="#icon-eye-off"></use></svg>';
                showPasswordButton.setAttribute("aria-label", hidden ? "Ẩn mật khẩu" : "Hiện mật khẩu");
            });
        }

        try {
            for (const src of firebaseScripts) await loadScript(src);
            await loadScript("./firebase-config.js");
            await loadScript("./auth.js");

            // Không chờ ghAuthReady/Firestore trước khi gắn nút đăng nhập.
            // Nếu Firestore chậm hoặc Rules chưa đúng, nút đăng nhập vẫn phải bấm được.
            if (!window.ghFirebaseConfigured || !window.ghAuth) {
                throw new Error("Firebase chưa được khởi tạo. Kiểm tra firebase-config.js và Authorized domains.");
            }

            const loginForm = document.getElementById("loginForm");
            loginForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                const email = document.getElementById("username").value.trim().toLowerCase();
                const password = document.getElementById("password").value;
                const btn = this.querySelector('button[type="submit"]');

                if (!email || !email.includes("@")) {
                    alert("Vui lòng nhập Email đã đăng ký.");
                    return;
                }

                if (btn) { btn.disabled = true; btn.dataset.oldText = btn.textContent; btn.textContent = "Đang đăng nhập..."; }
                try {
                    await window.ghAuth.login(email, password);
                    window.location.replace("./index.html");
                } catch (error) {
                    console.error("Firebase login error:", error);
                    const messages = {
                        "auth/invalid-credential": "Email hoặc mật khẩu không đúng.",
                        "auth/user-not-found": "Không tìm thấy tài khoản.",
                        "auth/wrong-password": "Mật khẩu không đúng.",
                        "auth/too-many-requests": "Có quá nhiều lần thử. Vui lòng thử lại sau.",
                        "auth/network-request-failed": "Không có kết nối mạng hoặc Firebase bị chặn.",
                        "auth/operation-not-allowed": "Firebase chưa bật đăng nhập Email/Password."
                    };
                    alert(messages[error.code] || ("Đăng nhập thất bại: " + (error.message || error)));
                    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.oldText || "Đăng nhập"; }
                }
            });

            // Nếu đã đăng nhập từ phiên trước thì chuyển thẳng vào trang chính.
            // Chạy song song, không khóa form đăng nhập.
            window.ghAuthReady.then(function (readyUser) {
                if (readyUser) window.location.replace("./index.html");
            }).catch(function () {});
        } catch (error) {
            console.error("Firebase bootstrap error:", error);
            alert("Không thể khởi tạo Firebase. Kiểm tra firebase-config.js, Firebase SDK và Authorized domains.");
        }
    }

    boot();
})();
</script>
</body>
</html>
