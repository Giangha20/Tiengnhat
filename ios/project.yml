name: NihongoMaster

options:
  bundleIdPrefix: com.nihongomaster
  deploymentTarget:
    iOS: "16.0"

targets:
  NihongoMaster:
    type: application
    platform: iOS
    sources:
      - path: Sources/NihongoMaster
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nihongomaster.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "NihongoMaster"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NihongoMaster cần quyền micro để hỗ trợ luyện phát âm và thu âm đối thoại tiếng Nhật."
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
