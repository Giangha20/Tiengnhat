name: Build iOS IPA (Xcode & xtool)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build-ios-ipa:
    name: Build & Package NihongoMaster.ipa
    runs-on: macos-14
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install XcodeGen
        run: |
          brew install xcodegen

      - name: 🚀 Build iOS App & Package IPA
        working-directory: ios
        run: |
          set -e
          echo "=== 1. Tạo project Xcode từ cấu hình XcodeGen ==="
          xcodegen generate --spec project.yml
          
          echo "=== 2. Kiểm tra các scheme có sẵn ==="
          xcodebuild -project NihongoMaster.xcodeproj -list
          
          echo "=== 3. Biên dịch ứng dụng iOS bằng xcodebuild ==="
          xcodebuild -project NihongoMaster.xcodeproj \
            -scheme NihongoMaster \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            clean build | tee /tmp/xcodebuild.log || {
              echo "❌ Xcodebuild gặp lỗi! Log chi tiết:"
              tail -n 100 /tmp/xcodebuild.log
              exit 1
            }
            
          echo "=== 4. Đóng gói file .ipa chuẩn Payload Apple ==="
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "❌ Không tìm thấy thư mục .app sau khi build!"
            ls -la build/
            exit 1
          fi
          
          echo "✓ Đã tìm thấy ứng dụng: $APP_DIR"
          rm -rf Payload NihongoMaster.ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r -q NihongoMaster.ipa Payload
          rm -rf Payload
          
          echo "🎉 ĐÓNG GÓI THÀNH CÔNG NIHONGOMASTER.IPA:"
          ls -lh NihongoMaster.ipa

      - name: 📤 Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NihongoMaster-iOS-IPA
          path: ios/NihongoMaster.ipa
          retention-days: 14

      - name: 📤 Upload Build Logs (If Error)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Debug-Log
          path: /tmp/xcodebuild.log
          retention-days: 7
