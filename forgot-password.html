<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đổi mật khẩu bằng OTP - Tiếng Trung Giang Hà</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top left,#ff7675 0,transparent 35%),radial-gradient(circle at bottom right,#74b9ff 0,transparent 35%),#f5f7fb}
.box{width:100%;max-width:430px;background:rgba(255,255,255,.96);padding:35px 30px;border-radius:25px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.logo{text-align:center;margin-bottom:25px}.logo img,.logo-default{width:85px;height:85px;border-radius:50%;object-fit:cover;margin:auto}.logo img{border:4px solid white;box-shadow:0 8px 25px rgba(214,48,49,.25)}.logo-default{display:flex;align-items:center;justify-content:center;color:white;font-size:38px;font-weight:800;background:linear-gradient(135deg,#d63031,#ff7675)}
h1{margin-top:15px;font-size:24px;color:#2d3436}.sub{margin-top:7px;color:#636e72;font-size:14px;line-height:1.5}
label{display:block;margin-bottom:8px;font-size:14px;font-weight:700;color:#2d3436}.group{margin-bottom:18px}
.input{width:100%;height:52px;border:2px solid #e5e7eb;border-radius:14px;padding:0 15px;font-size:15px;outline:none}.input:focus{border-color:#d63031;box-shadow:0 0 0 4px rgba(214,48,49,.08)}
.btn{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,#d63031,#ff7675);color:white;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.secondary{background:#f0f1f2;color:#2d3436;margin-top:10px}
.message{display:none;margin-top:15px;padding:12px;border-radius:12px;text-align:center;font-size:13px;line-height:1.5}.message.show{display:block}.success{color:#008f6f;background:#edfff8;border:1px solid #c9f5e6}.error{color:#c0392b;background:#fff0f0;border:1px solid #ffd6d6}
.back{text-align:center;margin-top:20px;font-size:14px}.back a{color:#d63031;font-weight:700;text-decoration:none}.note{margin-top:18px;font-size:12px;color:#7f8c8d;line-height:1.6;text-align:center}.hidden{display:none!important}
@media(prefers-color-scheme:dark){body{background:#151719}.box{background:#1e2023}h1,label{color:#f5f6fa}.sub,.note{color:#b2bec3}.input{background:#25282c;border-color:#3d4147;color:white}.secondary{background:#2a2d31;color:#f5f6fa}}
</style>

<svg id="inline-icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<defs>
<symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
<symbol id="icon-eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2C11.05 6.07 11.52 6 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-3.2 3.6M6.2 6.9C3.8 8.6 2.5 12 2.5 12S6 18 12 18c1.2 0 2.3-.2 3.3-.6"/></symbol>
<symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
<symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 2 2m-5-1 2 2"/></symbol>
<symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="icon-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3L12 4Z"/><path d="M12 9v5m0 3h.01"/></symbol>
<symbol id="icon-loading" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></symbol>
<symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M16 9.5a4 4 0 0 1 0 5m2.5-7.5a8 8 0 0 1 0 10"/></symbol>
<symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 6.5L20 12l-6.5 1.5L12 20l-1.5-6.5L4 12l6.5-2.5L12 3Z"/></symbol>
<symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 15c-1.2-.9-2-2.4-2-4a6 6 0 0 1 12 0c0 1.6-.8 3.1-2 4-.7.5-1 1.2-1 2h-6c0-.8-.3-1.5-1-2Z"/></symbol>
<symbol id="icon-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.6c-1 .9-1.7 1.3-1.7 2.8m0 3h.01"/></symbol>
<symbol id="icon-chat" viewBox="0 0 24 24"><path d="M5 18.5 3.5 21l4-1.5A9 9 0 1 0 5 18.5Z"/><path d="M8 10h8M8 14h5"/></symbol>
<symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></symbol>
<symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11.5 3.5 3.5 0 0 0 7 18Z"/></symbol>
<symbol id="icon-package" viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></symbol>
<symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="icon-hand" viewBox="0 0 24 24"><path d="M8 13V7a1.5 1.5 0 0 1 3 0v5m0-4a1.5 1.5 0 0 1 3 0v4m0-3a1.5 1.5 0 0 1 3 0v5m0-2a1.5 1.5 0 0 1 3 0v3c0 4-2.5 6-6.5 6H10c-2 0-3-1-4-2l-2-3a1.5 1.5 0 0 1 2.5-1.7L8 16"/></symbol>
</defs></svg>

<style>.ui-icon{width:20px;height:20px;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}.ui-icon-lg{width:24px;height:24px}.ui-icon-xl{width:32px;height:32px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <img src="avatar192.jpg" alt="Tiếng Trung Giang Hà" onerror="this.style.display='none';document.getElementById('logoDefault').style.display='flex';">
    <div id="logoDefault" class="logo-default" style="display:none">中</div>
    <h1>Đổi mật khẩu bằng OTP</h1>
    <p class="sub">Nhập email, nhận mã OTP 6 số, rồi dùng mã đó để tạo mật khẩu mới.</p>
  </div>

  <form id="otpForm">
    <div class="group">
      <label for="email">Email đăng ký</label>
      <input id="email" class="input" type="email" placeholder="example@gmail.com" autocomplete="email" required>
    </div>

    <button id="sendBtn" class="btn" type="button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-mail"></use></svg> Gửi mã OTP</button>

    <div id="otpStep" class="hidden">
      <div class="group" style="margin-top:18px">
        <label for="otp">Mã OTP 6 số</label>
        <input id="otp" class="input" inputmode="numeric" maxlength="6" placeholder="Nhập mã trong email" autocomplete="one-time-code">
      </div>

      <div class="group">
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword" class="input" type="password" minlength="6" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
      </div>

      <div class="group">
        <label for="confirmPassword">Nhập lại mật khẩu mới</label>
        <input id="confirmPassword" class="input" type="password" minlength="6" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
      </div>

      <button id="resetBtn" class="btn" type="submit"><svg class="ui-icon" aria-hidden="true"><use href="#icon-key"></use></svg> Đổi mật khẩu</button>
      <button id="resendBtn" class="btn secondary" type="button"><svg class="ui-icon" aria-hidden="true"><use href="#icon-loading"></use></svg> Gửi lại mã OTP</button>
    </div>
  </form>

  <div id="message" class="message"></div>
  <div class="back"><a href="login.html">← Quay lại đăng nhập</a></div>
  <div class="note">Mã OTP có hiệu lực 10 phút. Không chia sẻ mã OTP cho người khác.</div>
</div>

<script>
const form=document.getElementById("otpForm");
const emailEl=document.getElementById("email");
const otpStep=document.getElementById("otpStep");
const sendBtn=document.getElementById("sendBtn");
const resetBtn=document.getElementById("resetBtn");
const resendBtn=document.getElementById("resendBtn");
const msg=document.getElementById("message");

// Nếu frontend và backend dùng cùng một Node/Express server thì để trống.
// Khi tách frontend/backend, có thể đặt: window.XUEXI_API_BASE = "https://ten-backend-cua-ban.com";
const API_BASE=(()=>{
  const configured=String(window.XUEXI_API_BASE||"").trim().replace(/\/$/,"");
  if(configured) return configured;
  if(location.protocol==="file:" || (location.hostname==="localhost" && location.port && location.port!=="3000") || (location.hostname==="127.0.0.1" && location.port && location.port!=="3000")){
    return "http://localhost:3000";
  }
  return "";
})();

function show(type,text){
  msg.className="message show "+type;
  msg.textContent=text;
}

async function readJsonResponse(response){
  const contentType=response.headers.get("content-type")||"";
  const raw=await response.text();

  if(!contentType.toLowerCase().includes("application/json")){
    if(response.status===404 || /^\s*<!doctype html/i.test(raw) || /^\s*<html/i.test(raw)){
      throw new Error("Không tìm thấy API OTP. Hãy chạy `npm start` hoặc `node server.js`. Nếu dùng Live Server, backend vẫn phải chạy tại http://localhost:3000.");
    }
    throw new Error("Máy chủ OTP không trả về JSON. Hãy kiểm tra Terminal và địa chỉ API.");
  }

  try{
    return JSON.parse(raw);
  }catch{
    throw new Error("Server trả về JSON không hợp lệ. Hãy kiểm tra Terminal.");
  }
}

async function sendOtp(){
  const email=emailEl.value.trim().toLowerCase();

  if(!email||!email.includes("@")){
    show("error","Vui lòng nhập email hợp lệ.");
    return;
  }

  sendBtn.disabled=true;
  resendBtn.disabled=true;
  sendBtn.innerHTML='<svg class="ui-icon" aria-hidden="true"><use href="#icon-loading"></use></svg> Đang gửi...';

  try{
    const r=await fetch(`${API_BASE}/api/request-password-otp`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email})
    });

    const data=await readJsonResponse(r);

    if(!r.ok) throw new Error(data.error||"Không gửi được OTP.");

    otpStep.classList.remove("hidden");
    show("success",""+(data.message||"Đã gửi mã OTP. Hãy kiểm tra email và Spam."));
    document.getElementById("otp").focus();
  }catch(e){
    show("error",""+e.message);
  }finally{
    sendBtn.disabled=false;
    resendBtn.disabled=false;
    sendBtn.innerHTML='<svg class="ui-icon" aria-hidden="true"><use href="#icon-mail"></use></svg> Gửi mã OTP';
  }
}

sendBtn.addEventListener("click",sendOtp);
resendBtn.addEventListener("click",sendOtp);

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const email=emailEl.value.trim().toLowerCase();
  const otp=document.getElementById("otp").value.trim();
  const p=document.getElementById("newPassword").value;
  const c=document.getElementById("confirmPassword").value;

  if(!/^\d{6}$/.test(otp)) return show("error","Mã OTP phải gồm 6 chữ số.");
  if(p.length<6) return show("error","Mật khẩu mới phải có ít nhất 6 ký tự.");
  if(p!==c) return show("error","Hai mật khẩu không giống nhau.");

  resetBtn.disabled=true;
  resetBtn.innerHTML='<svg class="ui-icon" aria-hidden="true"><use href="#icon-loading"></use></svg> Đang đổi...';

  try{
    const r=await fetch(`${API_BASE}/api/reset-password-with-otp`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,otp,newPassword:p})
    });

    const data=await readJsonResponse(r);

    if(!r.ok) throw new Error(data.error||"Không thể đổi mật khẩu.");

    show("success","Đổi mật khẩu thành công! Đang chuyển sang đăng nhập...");
    setTimeout(()=>location.href="login.html",1200);
  }catch(e){
    show("error",""+e.message);
  }finally{
    resetBtn.disabled=false;
    resetBtn.innerHTML='<svg class="ui-icon" aria-hidden="true"><use href="#icon-key"></use></svg> Đổi mật khẩu';
  }
});
</script>
</body>
</html>
