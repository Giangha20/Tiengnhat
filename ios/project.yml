name: NihongoMaster

options:
  bundleIdPrefix: com.nihongomaster
  deploymentTarget:
    iOS: "16.0"

targets:
  NihongoMaster:
    type: application
    platform: iOS
    sources:
      - path: Sources/NihongoMaster
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nihongomaster.app
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"
